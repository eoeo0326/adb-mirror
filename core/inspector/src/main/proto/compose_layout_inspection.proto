// androidx compose/ui/ui-inspection (Apache-2.0)의 Compose inspector 프로토콜을 줄였다.
syntax = "proto3";
package layoutinspector.compose.inspection;
option java_package = "io.github.eoeo0326.adbmirror.core.inspector.proto.compose";

message StringEntry { int32 id = 1; string str = 2; }
message Rect { int32 x = 1; int32 y = 2; int32 w = 3; int32 h = 4; }
message Quad { sint32 x0 = 1; sint32 y0 = 2; sint32 x1 = 3; sint32 y1 = 4; sint32 x2 = 5; sint32 y2 = 6; sint32 x3 = 7; sint32 y3 = 8; }
message Bounds { Rect layout = 1; Quad render = 2; }
message ComposableRoot { int64 view_id = 1; repeated ComposableNode nodes = 2; repeated int64 views_to_skip = 3; }
message ComposableNode {
  enum Flags { NONE = 0; SYSTEM_CREATED = 1; HAS_MERGED_SEMANTICS = 2; HAS_UNMERGED_SEMANTICS = 4; INLINED = 8;
    NESTED_SINGLE_CHILDREN = 16; HAS_DRAW_MODIFIER = 32; HAS_CHILD_DRAW_MODIFIER = 64; }
  sint64 id = 1; repeated ComposableNode children = 2; int32 package_hash = 3; int32 filename = 4;
  int32 line_number = 5; int32 offset = 6; int32 name = 7; Bounds bounds = 8; int32 flags = 9;
  int64 view_id = 10; int32 recompose_count = 11; int32 recompose_skips = 12; sint32 anchor_hash = 13;
}
message Resource { int32 type = 1; int32 namespace = 2; int32 name = 3; }
message LambdaValue { int32 package_name = 1; int32 file_name = 2; int32 lambda_name = 3; int32 function_name = 4;
  int32 start_line_number = 5; int32 end_line_number = 6; }
message ParameterReference {
  enum Kind { UNSPECIFIED = 0; NORMAL = 1; MERGED_SEMANTICS = 2; UNMERGED_SEMANTICS = 3; }
  sint64 composable_id = 1; int32 parameter_index = 2; repeated int32 composite_index = 3; Kind kind = 4; sint32 anchor_hash = 5;
}
message Parameter {
  enum Type { UNSPECIFIED = 0; STRING = 1; BOOLEAN = 2; DOUBLE = 3; FLOAT = 4; INT32 = 5; INT64 = 6; COLOR = 7; RESOURCE = 8;
    DIMENSION_DP = 9; DIMENSION_SP = 10; DIMENSION_EM = 11; LAMBDA = 12; FUNCTION_REFERENCE = 13; ITERABLE = 14; }
  Type type = 1; int32 name = 2; repeated Parameter elements = 3; ParameterReference reference = 4; sint32 index = 5;
  oneof value { int32 int32_value = 11; int64 int64_value = 12; double double_value = 13; float float_value = 14;
    Resource resource_value = 15; LambdaValue lambda_value = 16; }
}
message ParameterGroup { sint64 composable_id = 1; repeated Parameter parameter = 3; repeated Parameter merged_semantics = 4; repeated Parameter unmerged_semantics = 5; }
message StateReadSettings { message None {} oneof method { None none = 1; } }

message GetComposablesCommand { int64 root_view_id = 1; bool skip_system_composables = 2; int32 generation = 3;
  bool extract_all_parameters = 4; bool allow_empty_if_unchanged = 5; }
message GetComposablesResponse { repeated StringEntry strings = 1; repeated ComposableRoot roots = 2; bool unchanged = 3; }
message GetParametersCommand { int64 root_view_id = 1; sint64 composable_id = 2; bool skip_system_composables = 3;
  int32 max_recursions = 4; int32 max_initial_iterable_size = 5; int32 generation = 6; sint32 anchor_hash = 7; }
message GetParametersResponse { repeated StringEntry strings = 1; ParameterGroup parameter_group = 2; }
message GetParameterDetailsCommand { int64 root_view_id = 1; ParameterReference reference = 2; int32 start_index = 3;
  int32 max_elements = 4; bool skip_system_composables = 5; int32 max_recursions = 6; int32 max_initial_iterable_size = 7; int32 generation = 8; }
message GetParameterDetailsResponse { int64 root_view_id = 1; repeated StringEntry strings = 2; Parameter parameter = 3; }
message UpdateSettingsCommand { bool include_recompose_counts = 1; bool keep_recompose_counts = 2;
  bool delay_parameter_extractions = 3; bool reduce_child_nesting = 4; StateReadSettings state_read_settings = 5; }
message UpdateSettingsResponse { bool can_delay_parameter_extractions = 3; }
message UnknownCommandResponse { bytes command_bytes = 1; }

message Command {
  oneof specialized {
    GetComposablesCommand get_composables_command = 1;
    GetParametersCommand get_parameters_command = 2;
    GetParameterDetailsCommand get_parameter_details_command = 4;
    UpdateSettingsCommand update_settings_command = 5;
  }
}
message Response {
  oneof specialized {
    GetComposablesResponse get_composables_response = 1;
    GetParametersResponse get_parameters_response = 2;
    GetParameterDetailsResponse get_parameter_details_response = 4;
    UpdateSettingsResponse update_settings_response = 5;
    UnknownCommandResponse unknown_command_response = 100;
  }
}
